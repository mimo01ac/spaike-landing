<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 820px at 18% -12%,#16233d 0%,#0f1a2e 58%,#0b1526 100%);
  color:#f3eee2;position:relative;overflow:hidden}
.pad{position:absolute;inset:0;padding:60px 72px 52px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.5px;font-size:30px;color:#f3eee2}
.brand b{color:#d4a857}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#d4a857}
.eyebrow svg{display:block}
.mid{margin-top:46px}
h1{font-family:"Source Serif Pro",Georgia,"Times New Roman",serif;
  font-size:72px;line-height:1.02;font-weight:700;letter-spacing:-1.2px;color:#f3eee2}
.kick{font-size:17px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#d4a857;margin-bottom:18px}
.flow{margin-top:44px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center}
.src{flex:0 0 330px;text-align:right;padding-right:34px;font-size:24px;font-weight:600;color:#cbc6b6;white-space:nowrap}
.arrow{flex:0 0 84px;display:flex;align-items:center;color:#d4a857}
.arrow .ln{height:2.5px;background:#d4a857;flex:1;opacity:.55}
.arrow .hd{margin-left:-2px;font-size:32px;line-height:0}
.res{flex:1;padding-left:34px;font-size:27px;font-weight:800;color:#f3eee2;white-space:nowrap}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:19px;color:rgba(243,238,226,.42)}
.foot .tag{color:#d4a857;opacity:.85;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:15px}
</style></head><body><div class="pad">
  <div class="top">
    <div class="brand">Sp<b>AI</b>ke</div>
    <div class="eyebrow">
      <svg width="38" height="38" viewBox="0 0 48 48"><g fill="#d4a857" transform="rotate(12 24 24)">
        <path d="M24 24 C12 18 16 7 24 5 C32 7 36 18 24 24 Z"/>
        <path d="M24 24 C30 12 41 16 43 24 C41 32 30 36 24 24 Z"/>
        <path d="M24 24 C36 30 32 41 24 43 C16 41 12 30 24 24 Z"/>
        <path d="M24 24 C18 36 7 32 5 24 C7 16 18 12 24 24 Z"/>
      </g></svg>
      <span>Microsoft Copilot</span>
    </div>
  </div>
  <div class="mid">
    <div class="kick">Hands-on Copilot training</div>
    <h1>From chat to<br>your own agents.</h1>
  </div>
  <div class="flow">
    <div class="row"><div class="src">Before a client meeting</div><div class="arrow"><span class="ln"></span><span class="hd">›</span></div><div class="res">A brief, ready</div></div>
    <div class="row"><div class="src">After the call</div><div class="arrow"><span class="ln"></span><span class="hd">›</span></div><div class="res">Follow-up drafted</div></div>
    <div class="row"><div class="src">A rough idea</div><div class="arrow"><span class="ln"></span><span class="hd">›</span></div><div class="res">Proposal first draft</div></div>
  </div>
  <div class="foot"><span>Three hours, on your own tasks, not a demo.</span><span class="tag">Commercial impact, powered by AI</span></div>
</div></body></html>
